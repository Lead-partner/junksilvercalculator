<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510"><style>text{font-family:Arial,sans-serif;fill:#151A18}.muted{fill:#515A56}.bold{font-weight:700}</style><rect width="100%" height="100%" fill="#FBFBFA"/><text x="28" y="43" font-size="30" class="bold">From a coin count to melt value</text><rect x="28" y="66" width="664" height="80" fill="#FBFBFA" stroke="#78817D"/><text x="46" y="99" font-size="28" class="bold">Coin count × gross weight</text><text x="46" y="127" font-size="22" class="muted">number of coins × grams per coin</text><path d="M360 149v16m-6-6 6 6 6-6" fill="none" stroke="#1E4A38" stroke-width="2"/><rect x="28" y="169" width="664" height="80" fill="#FBFBFA" stroke="#78817D"/><text x="46" y="202" font-size="28" class="bold">× silver fineness</text><text x="46" y="230" font-size="22" class="muted">0.900, 0.400 or 0.350</text><path d="M360 252v16m-6-6 6 6 6-6" fill="none" stroke="#1E4A38" stroke-width="2"/><rect x="28" y="272" width="664" height="80" fill="#FBFBFA" stroke="#78817D"/><text x="46" y="305" font-size="28" class="bold">÷ 31.1034768</text><text x="46" y="333" font-size="22" class="muted">grams per troy ounce → silver ozt</text><path d="M360 355v16m-6-6 6 6 6-6" fill="none" stroke="#1E4A38" stroke-width="2"/><rect x="28" y="375" width="664" height="80" fill="#E1EAE5" stroke="#78817D"/><text x="46" y="408" font-size="28" class="bold">× spot price per troy ounce</text><text x="46" y="436" font-size="22" class="muted">silver ozt × USD/ozt → melt in USD</text><text x="28" y="501" font-size="22" class="muted">Sum the melt values for the separate coin groups.</text></svg>